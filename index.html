<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3A2A1C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-title" content="חלה">
<title>חלה · Challah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EFE6D9; --panel:#F8F3EA; --panel-edge:#DCCBB3;
  --ink:#3A2A1C; --muted:#8C775F; --soft:#7A6650;
  --line:#E2D4BE; --dot:#DFD0B8; --chip:#CBB79C; --chip-hover:#E3D5C0;
  --card:#3A2A1C; --card-ink:#F4EADA; --card-lbl:#C6B398; --card-edge:#55432F;
  --quiet:#E4D7C2; --quiet-ink:#4A3726;
  --field:#FFFDF8; --field-edge:#E0D0B6; --accent:#B5761F; --gold:#E8B44A; --bullet:#C8A96B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#221A13; --panel:#2C2219; --panel-edge:#3C2F22;
    --ink:#F2E9DB; --muted:#A89176; --soft:#B9A386;
    --line:#3E3124; --dot:#3A2E22; --chip:#5A4733; --chip-hover:#3A2E22;
    --card:#120D08; --card-ink:#F4EADA; --card-lbl:#B49F84; --card-edge:#463726;
    --quiet:#3A2E22; --quiet-ink:#EFE3D0;
    --field:#1C150F; --field-edge:#4A3A29; --accent:#E8B44A;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Heebo,"Segoe UI","Arial Hebrew",system-ui,sans-serif;
  padding:24px 18px 56px;-webkit-text-size-adjust:100%;}
body.en{font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;}
.wrap{max-width:680px;margin:0 auto;}
.topbar{display:flex;justify-content:flex-end;margin-bottom:10px;}
.lang{display:flex;gap:6px;background:var(--quiet);border-radius:999px;padding:3px;}
.lang button{border:none;background:none;font-family:inherit;font-size:13px;font-weight:600;
  color:var(--soft);padding:5px 12px;border-radius:999px;cursor:pointer;}
.lang button[data-on="1"]{background:var(--card);color:var(--card-ink);}
h1{font-size:36px;font-weight:900;letter-spacing:-.5px;line-height:1.05;margin:0;}
body.en h1{font-weight:800;letter-spacing:-1px;}
.sub{font-size:15px;font-weight:300;color:var(--soft);margin:10px 0 22px;max-width:52ch;line-height:1.6;}
.seg-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.seg-lbl{font-size:13px;font-weight:700;color:var(--soft);width:66px;}
.seg{display:flex;gap:8px;flex-wrap:wrap;}
.chip{background:none;border:1px solid var(--chip);color:var(--soft);border-radius:999px;
  padding:7px 14px;font-size:14px;font-family:inherit;cursor:pointer;transition:background .15s,color .15s;}
.chip:hover{background:var(--chip-hover);}
.chip[data-on="1"]{background:var(--card);border-color:var(--card);color:var(--card-ink);}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0 26px;}
.total{background:var(--card);color:var(--card-ink);border-radius:14px;padding:16px 18px;}
.total-quiet{background:var(--quiet);color:var(--quiet-ink);}
.total-quiet .total-lbl{color:var(--soft);}
.total-num{font-size:29px;font-weight:900;line-height:1.15;padding:5px 1px 6px;}
.total-lbl{font-size:12.5px;font-weight:300;color:var(--card-lbl);margin-top:6px;line-height:1.45;}
.total-edit{display:flex;align-items:baseline;gap:8px;}
.total-input{box-sizing:content-box;flex:0 0 auto;font-family:inherit;font-size:29px;font-weight:900;
  line-height:1.15;color:var(--card-ink);background:rgba(255,255,255,.06);border:1px solid var(--card-edge);
  border-radius:9px;padding:4px 10px 5px;direction:ltr;text-align:center;}
.total-input:focus{outline:none;border-color:var(--gold);background:rgba(232,180,74,.12);}
.total-unit{font-size:15px;font-weight:400;color:var(--card-lbl);}
.panel{background:var(--panel);border-radius:14px;padding:20px 20px 12px;box-shadow:0 1px 0 var(--panel-edge);}
.head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;
  padding-bottom:12px;border-bottom:1px solid var(--line);}
.headline{font-size:15px;font-weight:700;}
.hint{font-size:13px;font-weight:300;color:var(--muted);}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dotted var(--dot);}
.row:last-child{border-bottom:none;}
.sub-head{font-size:13px;font-weight:700;color:var(--soft);margin:14px 0 2px;padding-top:12px;border-top:1px solid var(--line);}
.row-top{border-top:1px solid var(--line);margin-top:6px;padding-top:14px;}
.label{flex:1;font-size:15.5px;font-weight:400;}
.label small{display:block;font-size:12.5px;color:var(--muted);font-weight:300;margin-top:1px;}
.inp{width:84px;text-align:center;direction:ltr;font-family:inherit;font-size:18px;font-weight:700;
  color:var(--ink);background:var(--field);border:1px solid var(--field-edge);border-radius:8px;padding:6px 8px;}
.inp:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
.unit{width:42px;font-size:12.5px;color:var(--muted);}
h2{font-size:14px;font-weight:700;margin:30px 0 12px;color:var(--soft);letter-spacing:.03em;}
ol.steps{list-style:none;margin:0;padding:0;}
ol.steps li{position:relative;padding-inline-start:22px;padding-bottom:14px;font-size:15px;line-height:1.65;font-weight:300;}
ol.steps li::before{content:"";position:absolute;inset-inline-start:4px;top:10px;width:7px;height:7px;
  border-radius:50%;background:var(--bullet);}
ol.steps b{font-weight:700;}
.notes{margin-top:22px;background:var(--panel);border-radius:14px;padding:16px 18px;
  box-shadow:0 1px 0 var(--panel-edge);}
.notes h3{margin:0 0 8px;font-size:14px;font-weight:700;}
.notes p{margin:0 0 10px;font-size:14px;font-weight:300;line-height:1.6;color:var(--soft);}
.notes p:last-child{margin-bottom:0;}
.notes b{font-weight:700;color:var(--ink);}
.foot{margin-top:24px;font-size:12.5px;color:var(--muted);font-weight:300;line-height:1.7;}
@media (max-width:620px){
  h1{font-size:29px;}
  .totals{grid-template-columns:1fr 1fr;}
  .total-quiet{grid-column:1/-1;}
  .total-input,.total-num{font-size:25px;}
  .seg-lbl{width:58px;}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="lang" id="langSeg">
      <button data-v="he">עברית</button><button data-v="en">English</button>
    </div>
  </div>

  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>

  <div class="seg-row">
    <span class="seg-lbl" id="veganLbl"></span>
    <div class="seg" id="veganSeg"></div>
  </div>
  <div class="seg-row">
    <span class="seg-lbl" id="fatLbl"></span>
    <div class="seg" id="fatSeg"></div>
  </div>
  <div class="seg-row">
    <span class="seg-lbl" id="flourSegLbl"></span>
    <div class="seg" id="flourSeg"></div>
  </div>
  <div class="seg-row">
    <span class="seg-lbl" id="shapeLbl"></span>
    <div class="seg" id="shapeSeg"></div>
  </div>

  <div class="totals">
    <div class="total">
      <div class="total-edit">
        <input class="total-input" id="unitTop" inputmode="decimal">
        <span class="total-unit" id="unitTopUnit"></span>
      </div>
      <div class="total-lbl" id="unitTopLbl"></div>
    </div>
    <div class="total">
      <div class="total-edit">
        <input class="total-input" id="countTop" inputmode="numeric">
        <span class="total-unit" id="topUnit"></span>
      </div>
      <div class="total-lbl" id="countLbl"></div>
    </div>
    <div class="total total-quiet">
      <div class="total-num" id="flourNum"></div>
      <div class="total-lbl" id="flourLbl"></div>
    </div>
  </div>

  <div class="panel">
    <div class="head"><span class="headline" id="ingHead"></span><span class="hint" id="ingHint"></span></div>
    <div id="rows"></div>
    <div id="washRows"></div>
    <div class="row row-top">
      <span class="label" id="countLabel"></span>
      <input class="inp" id="countInput" inputmode="numeric"><span class="unit" id="countUnit"></span>
    </div>
    <div class="row">
      <span class="label"><span id="doughLabel"></span><small id="doughNote"></small></span>
      <input class="inp" id="doughInput" inputmode="decimal"><span class="unit" id="doughUnit"></span>
    </div>
  </div>

  <h2 id="methodHead"></h2>
  <ol class="steps" id="steps"></ol>

  <div class="notes">
    <h3 id="notesHead"></h3>
    <p id="noteFat"></p>
    <p id="noteWash"></p>
    <p id="noteFlour"></p>
  </div>

  <p class="foot" id="foot"></p>
</div>

<script>
/* ---------- base recipe in grams ----------
   Flour always totals 800 g at scale 1; only the water moves with the
   flour's strength — 350 for the 14.4% mix, 360 for a single very strong
   flour, 330 for a 13.5% brioche flour, which absorbs less.          */
var REST={oil:58,honey:40,sugar:48,yolks:36,salt:17,yeast:14};
var OZ=28.3495, BASE_FLOUR=800, WASTE=1.03;   /* dough = pieces x 1.03 (3% loss) */

function mkBase(flours,water){
  var b={}; for(var f in flours) b[f]=flours[f];
  b.water=water; for(var r in REST) b[r]=REST[r]; return b;
}
var FLOURS={
  mix:     {base:mkBase({manitoba:550,challahFlour:250},350), knead:0,
            he:"מניטובה + חלה", en:"Two flours"},
  strong:  {base:mkBase({flour:800},360), knead:-2,
            he:"מניטובה בלבד", en:"Strong only"},
  brioche: {base:mkBase({flour:800},344), knead:0,
            he:"בריוש 13.5%", en:"Brioche flour"},
  bread:   {base:mkBase({flour:800},330), knead:0,
            he:"קמח לחם", en:"Bread flour"}
};
/* Supermarket bread flour: Israeli (extra gluten added) vs US (~12-12.7% protein) */
var BREAD_HE=mkBase({flour:800},330), BREAD_EN=mkBase({flour:800},320);
for(var m in FLOURS){ var t=0; for(var bk in FLOURS[m].base) t+=FLOURS[m].base[bk]; FLOURS[m].total=t; }

var FLOURNAME={
  mix:{he:["קמח מניטובה","קמח חלה"],en:["Strong flour (15.5%)","Softer flour (12%)"]},
  strong:{he:"קמח מניטובה (15.5%)",en:"Strong bread flour (15.5%)"},
  brioche:{he:"קמח בריוש (13.5%)",en:"Brioche flour (13.5%)"},
  bread:{he:"קמח לחם (סופר)",en:"Bread flour (supermarket)"}
};
var REST_HE=[{k:"water",n:"מים",u:'מ"ל'},{k:"oil",n:"שמן",u:"גר'"},{k:"butter",n:"חמאה (לא מלוחה)",u:"גר'"},{k:"honey",n:"דבש",u:"גר'"},
 {k:"sugar",n:"סוכר",u:"גר'"},{k:"yolks",n:"חלמונים",u:"גר'"},{k:"salt",n:"מלח",u:"גר'"},
 {k:"yeast",n:"שמרים יבשים",u:"גר'"}];
var REST_EN=[{k:"water",n:"Water",cup:236.6,mode:"cup"},{k:"oil",n:"Neutral oil",cup:218,mode:"spoon"},{k:"butter",n:"Unsalted butter",cup:227,mode:"butter"},
 {k:"honey",n:"Honey",cup:340,mode:"spoon"},{k:"sugar",n:"Granulated sugar",cup:200,mode:"cup"},
 {k:"yolks",n:"Egg yolks",mode:"yolk"},{k:"salt",n:"Fine sea salt",cup:288,mode:"spoon"},
 {k:"yeast",n:"Instant yeast",cup:149,mode:"yeast"}];

var lang="he", flour="mix", vegan=false, dairy=false, unitW=600, focusedId=null, shape="loaf", strands=4;
try{ var st=localStorage.getItem("challah_lang"); if(st==="en"||st==="he") lang=st;
     vegan=localStorage.getItem("challah_vegan")==="1";
     dairy=!vegan && localStorage.getItem("challah_dairy")==="1";
     var sf=localStorage.getItem("challah_flour"); if(FLOURS[sf]) flour=sf; }catch(e){}
var scale=1800*WASTE/TOT();   /* default: 3 loaves x 600 g */

function isEn(){ return lang==="en"; }
/* Vegan: no yolks; extra oil = 80% of the yolk weight */
/* Dairy: butter replaces the oil at 1.2x (butter is ~82% fat), and the ~16% water
   it brings is taken out of the water. */
function BASE(){
  var b=(flour==="bread")?(isEn()?BREAD_EN:BREAD_HE):FLOURS[flour].base;
  if(!vegan && !dairy) return b;
  var c={}; for(var k in b) c[k]=b[k];
  if(vegan){ c.oil=b.oil+0.8*b.yolks; c.yolks=0; }
  else { c.butter=b.oil*1.2; c.oil=0; c.water=b.water-0.16*c.butter; }
  return c;
}
function TOT(){ var b=BASE(),t=0; for(var k in b) t+=b[k]; return t; }
function washG(){ return Math.max(40,dough()*0.015); }   /* ~1.5% of dough weight */
function spoonTxt(g,cup){ var c=g/cup,tb=c*16,ts=c*48; return tb>=1?frac(tb)+" Tbsp":frac(ts)+" tsp"; }
function washRows(){
  var en=isEn(), g=washG(), out=[];
  if(vegan){
    var ms=g*.3, wa=g*.6, sa=g*.1;
    out.push([en?"Malt syrup":"מאלט סירופ", W(ms), en?"oz":"גר'", en?spoonTxt(ms,330):""]);
    out.push([en?"Water":"מים", W(wa), en?"oz":"גר'", en?spoonTxt(wa,236.6):""]);
    out.push([en?"Fine salt":"מלח", W(sa), en?"oz":"גר'", en?spoonTxt(sa,288):""]);
  } else {
    var n=Math.max(1,Math.round(g/55));
    out.push([en?"Eggs, beaten":"ביצים טרופות", String(n), en?(n===1?"egg":"eggs"):"ביצים", en?"+ 1 tsp water per egg":"+ כפית מים לכל ביצה"]);
  }
  out.push([en?"Sesame seeds":"שומשום", "", "", en?"to sprinkle on top":"לפיזור מעל"]);
  return out;
}
function yolkG(){ return FLOURS[flour].base.yolks*scale; }
function ROWS(){
  var rows=[], nm=FLOURNAME[flour][isEn()?"en":"he"];
  if(flour==="mix"){
    rows.push({k:"manitoba",n:nm[0],u:"גר'",cup:120,mode:"cup"});
    rows.push({k:"challahFlour",n:nm[1],u:"גר'",cup:120,mode:"cup"});
  } else {
    rows.push({k:"flour",n:nm,u:"גר'",cup:120,mode:"cup"});
  }
  return rows.concat(isEn()?REST_EN:REST_HE).filter(function(r){ return !(vegan && r.k==="yolks") && !(dairy && r.k==="oil") && !(!dairy && r.k==="butter"); });
}
function dough(){ return TOT()*scale; }
function flourG(){ return BASE_FLOUR*scale; }
function hydration(){ return BASE().water/BASE_FLOUR*100; }
function amt(key){ return BASE()[key]*scale; }
function unitG(){ return isEn()? (unitW||21.25)*OZ : (unitW||600); }
function loaves(){ return Math.max(1,Math.round(dough()/(unitG()*WASTE))); }
function actualG(){ return dough()/(loaves()*WASTE); }   /* weight of each piece */

/* ---------- number display ---------- */
function fmtG(n){ if(!isFinite(n))return"0"; var r=n<25?Math.round(n*2)/2:Math.round(n); return String(r); }
function fmtOz(grams){ var v=grams/OZ;
  if(v>=3) return String(Math.round(v*4)/4);
  if(v>=0.5) return String(Math.round(v*10)/10);
  return String(Math.round(v*100)/100); }
function W(grams){ return isEn()?fmtOz(grams):fmtG(grams); }           /* number only */
function WU(grams){ return W(grams)+(isEn()?" oz":" גר'"); }           /* number + unit */
function lbText(grams){ var v=grams/OZ, lb=Math.floor(v/16), rest=Math.round((v-lb*16)*10)/10;
  return lb>0?lb+" lb "+rest+" oz":Math.round(v*10)/10+" oz"; }
var FR=[[0,""],[.125,"\u215B"],[.25,"\u00BC"],[.333,"\u2153"],[.5,"\u00BD"],[.667,"\u2154"],[.75,"\u00BE"],[.875,"\u215E"],[1,""]];
function frac(x){ var whole=Math.floor(x),rem=x-whole,best=FR[0];
  FR.forEach(function(f){ if(Math.abs(f[0]-rem)<Math.abs(best[0]-rem)) best=f; });
  if(best[0]===1){ whole+=1; best=FR[0]; }
  if(whole===0&&best[1]==="") return "0";
  return (whole>0?whole:"")+best[1]; }
function volText(r,grams){
  var hyd=Math.round(hydration());
  if(!isEn()){
    if(r.k==="water") return hyd+"% הידרציה";
    return r.k==="yolks" ? "≈ "+(Math.round(grams/18*10)/10)+" חלמונים" : "";
  }
  if(r.mode==="yolk") return (Math.round(grams/18*10)/10)+" large yolks";
  var cups=grams/r.cup, tbsp=cups*16, tsp=cups*48;
  if(r.mode==="butter") return frac(tbsp)+" Tbsp  ·  "+(Math.round(grams/113.4*10)/10)+" sticks";
  if(r.mode==="yeast") return frac(tsp)+" tsp  ·  "+(Math.round(grams/7*10)/10)+" packets";
  if(r.k==="water") return frac(cups)+(cups<1.25?" cup":" cups")+"  ·  "+hyd+"% hydration";
  if(r.mode==="spoon"||cups<0.25) return tbsp>=1?frac(tbsp)+" Tbsp":frac(tsp)+" tsp";
  return frac(cups)+(cups<1.25?" cup":" cups"); }

/* ---------- selectors ---------- */
var shapeSeg=document.getElementById("shapeSeg"), langSeg=document.getElementById("langSeg"), rowsEl=document.getElementById("rows"),
    flourSeg=document.getElementById("flourSeg"), veganSeg=document.getElementById("veganSeg");

[false,true].forEach(function(v){
  var b=document.createElement("button"); b.className="chip"; b.setAttribute("data-v",v);
  b.onclick=function(){
    if(vegan===v) return;
    var keep=dough(); vegan=v; if(v) dairy=false; scale=keep/TOT();
    try{ localStorage.setItem("challah_vegan",v?"1":"0"); localStorage.setItem("challah_dairy",dairy?"1":"0"); }catch(e){}
    focusedId=null; buildRows(); render(); };
  veganSeg.appendChild(b); });

var fatSeg=document.getElementById("fatSeg");
[false,true].forEach(function(v){
  var b=document.createElement("button"); b.className="chip"; b.setAttribute("data-v",v);
  b.onclick=function(){
    if(dairy===v) return;
    var keep=dough(); dairy=v; if(v) vegan=false; scale=keep/TOT();
    try{ localStorage.setItem("challah_dairy",v?"1":"0"); localStorage.setItem("challah_vegan",vegan?"1":"0"); }catch(e){}
    focusedId=null; buildRows(); render(); };
  fatSeg.appendChild(b); });

["mix","strong","brioche","bread"].forEach(function(v){
  var b=document.createElement("button"); b.className="chip"; b.setAttribute("data-v",v);
  b.onclick=function(){
    if(flour===v) return;
    var keepDough=dough();              /* switching flour keeps the batch size */
    flour=v; scale=keepDough/TOT();
    try{ localStorage.setItem("challah_flour",v); }catch(e){}
    focusedId=null; buildRows(); render(); };
  flourSeg.appendChild(b); });

["loaf","rolls"].forEach(function(v){
  var b=document.createElement("button"); b.className="chip"; b.setAttribute("data-v",v);
  b.onclick=function(){ if(shape!==v){ shape=v; unitW = isEn()?(v==="rolls"?4.75:21.25):(v==="rolls"?135:600);
      scale = (v==="rolls"?15:3)*unitG()*WASTE/TOT(); }
    focusedId=null; render(); };
  shapeSeg.appendChild(b); });
Array.prototype.forEach.call(langSeg.children,function(b){
  b.onclick=function(){
    var v=b.getAttribute("data-v"); if(v===lang) return;
    var oldG=unitG(), keepD=dough(); lang=v; scale=keepD/TOT(); unitW = isEn()? Math.round(oldG/OZ*4)/4 : Math.round(oldG);
    try{ localStorage.setItem("challah_lang",v); }catch(e){}
    focusedId=null; buildRows(); render(); }; });

function buildRows(){
  rowsEl.innerHTML="";
  ROWS().forEach(function(r){
    var d=document.createElement("div"); d.className="row";
    d.innerHTML='<span class="label">'+r.n+'<small id="n_'+r.k+'"></small></span>'+
      '<input class="inp" id="i_'+r.k+'" inputmode="decimal"><span class="unit">'+
      (isEn()?"oz":(r.u||"גר'"))+'</span>';
    rowsEl.appendChild(d);
    bind("i_"+r.k,function(t){ var v=num(t); if(v>0) scale=(isEn()?v*OZ:v)/BASE()[r.k]; });
  });
}
function num(t){ var v=parseFloat(String(t).replace(",",".")); return isFinite(v)?v:NaN; }
function bind(id,onVal){
  var el=document.getElementById(id);
  el.addEventListener("focus",function(){ focusedId=id; el.select(); });
  el.addEventListener("blur",function(){ focusedId=null; render(); });
  el.addEventListener("input",function(){ onVal(el.value); render(); });
}
function set(id,val){ var el=document.getElementById(id); if(focusedId!==id) el.value=val; }

bind("doughInput",function(t){ var v=num(t); if(v>0)
  scale=(isEn()? (v<15?v*16:v)*OZ : (v<50?v*1000:v))/TOT(); });
bind("countInput",function(t){ var c=parseInt(t,10); if(c>0) scale=c*unitG()*WASTE/TOT(); });
bind("countTop",function(t){ var c=parseInt(t,10); if(c>0) scale=c*unitG()*WASTE/TOT(); });

function steps(){
  var flourTxt = (flour==="mix")
    ? (isEn() ? "<b>"+WU(amt("manitoba"))+"</b> strong flour and <b>"+WU(amt("challahFlour"))+"</b> softer flour"
              : "<b>"+W(amt("manitoba"))+"</b> מניטובה ו־<b>"+W(amt("challahFlour"))+"</b> קמח חלה")
    : (isEn() ? "<b>"+WU(amt("flour"))+"</b> flour" : "<b>"+WU(amt("flour"))+"</b> קמח");
  var strandW=W(actualG()/strands);
  var big=flourG()>1600, rolls=shape==="rolls";
  if(isEn()){
    var len=strands===3?"8":(strands===4?"10":"12");
    var wash = vegan?'malt syrup wash':'egg wash';
    var bake = rolls ? 'Bake <b>15–17 minutes at 375°F</b>'
      : 'Bake <b>'+(actualG()>450?"32–36":(actualG()>300?"24–26":"20"))+' minutes at 375°F</b>';
    var s=[
      'In the mixer bowl, add in this order: <b>'+WU(amt("water"))+' ice-cold water</b>, <b>'+WU(amt("honey"))+' honey</b>, '+(dairy?'':'<b>'+WU(amt("oil"))+' oil</b>'+(vegan?'':', '))+(vegan?'':'<b>'+WU(amt("yolks"))+' egg yolks</b>')+' and <b>'+WU(amt("salt"))+' salt</b>. Layer the '+flourTxt+' on top, then <b>'+WU(amt("sugar"))+' sugar</b> and <b>'+WU(amt("yeast"))+' instant yeast</b> over the flour. Start kneading.',
      (dairy ? 'Once a dough forms, knead on high speed for about <b>3 minutes</b>, until it clears the sides of the bowl. Add <b>'+WU(amt("butter"))+' unsalted butter</b>, soft but not melted, a few small pieces at a time, and keep kneading until each addition is absorbed — <b>8 minutes</b> on high in all — then knead <b>3 more minutes by hand</b>. The dough should come out at about <b>75°F (24°C)</b>.'
             : 'Once a dough forms, knead on high speed for <b>8 minutes</b>, then knead <b>3 more minutes by hand</b>. The dough should come out at about <b>75°F (24°C)</b>.')+(big?' With this much dough, knead in two batches unless your mixer is 6 qt or larger.':''),
      'Round the dough, cover, and let it rise 1 to 1½ hours, until doubled.',
      rolls ? 'Divide into <b>'+loaves()+' pieces of '+WU(actualG())+'</b> each, round them, and rest covered for <b>30 minutes</b>.'
            : 'Divide into <b>'+(loaves()*strands)+' balls of '+strandW+' oz</b> — '+loaves()+' loaves × '+strands+' strands — round them, and rest covered for <b>30 minutes</b>.',
      rolls ? 'Roll each piece into a tight ball and set on a parchment-lined sheet pan about 1½ inches apart. Proof uncovered 45–60 minutes, then brush with '+wash+' and scatter sesame seeds on top.'
            : 'Roll each ball into a rope about '+len+' inches long and braid every '+strands+' ropes into a loaf. <b>Brush with '+wash+'</b> right after shaping, then proof uncovered for 1½ hours.',
      rolls ? bake+'.' : 'At the end of the final proof, <b>brush a second time</b> and scatter sesame seeds on top.',
    ];
    if(!rolls) s.push(bake+'.');
    return s;
  }
  var lenh=strands===3?"20":(strands===4?"25":"30");
  var washH = vegan?'תערובת מאלט הסירופ':'ביצה טרופה';
  var bakeH = rolls ? 'אופים <b>15–17 דק\' ב־190°</b> חום עליון־תחתון'
    : 'אופים <b>'+(actualG()>450?"32–36":(actualG()>300?"24–26":"20"))+' דק\' ב־190°</b> חום עליון־תחתון';
  var h=[
    'שמים בקערה לפי הסדר: <b>'+fmtG(amt("water"))+' מ"ל מי קרח</b>, <b>'+WU(amt("honey"))+' דבש</b>, '+(dairy?'':'<b>'+WU(amt("oil"))+' שמן</b>'+(vegan?'':', '))+(vegan?'':'<b>'+WU(amt("yolks"))+' חלמונים</b>')+' ו<b>'+WU(amt("salt"))+' מלח</b>. מעליהם '+flourTxt+', ומעל הקמח <b>'+WU(amt("sugar"))+' סוכר</b> ו<b>'+WU(amt("yeast"))+' שמרים</b>. מתחילים ללוש.',
    (dairy ? 'לאחר שנוצר בצק לשים במהירות גבוהה כ־<b>3 דק\'</b>, עד שהבצק מתנקה מדפנות הקערה. מוסיפים <b>'+WU(amt("butter"))+' חמאה</b> רכה אך לא מומסת, בחתיכות קטנות, כמה בכל פעם, וממשיכים ללוש עד שהיא נבלעת — בסך הכול <b>8 דק\'</b> במהירות גבוהה — ואז לשים עוד <b>3 דק\' ידנית</b>. הבצק צריך להיות בטמפרטורה של כ־<b>24 מעלות צלזיוס</b>.'
           : 'לאחר שנוצר בצק לשים במהירות גבוהה <b>8 דק\'</b>, ואז לשים עוד <b>3 דק\' ידנית</b>. הבצק צריך להיות בטמפרטורה של כ־<b>24 מעלות צלזיוס</b>.')+(big?' בכמות הזו כדאי ללוש בשתי מנות אם המלוש קטן מ־6 ליטר.':''),
    'מכדררים, מכסים ומתפיחים שעה עד שעה וחצי, עד הכפלת נפח.',
    rolls ? 'מחלקים ל־<b>'+loaves()+' לחמניות של '+WU(actualG())+'</b>, מכדררים ומניחים מכוסה <b>חצי שעה</b>.'
          : 'מחלקים ל־<b>'+(loaves()*strands)+' כדורים של '+strandW+' גר\'</b> — '+loaves()+' חלות × '+strands+' צמות — מכדררים ומניחים מכוסה <b>חצי שעה</b>.',
    rolls ? 'מכדררים כל חתיכה לכדור חלק ומניחים בתבנית עם רווח של כ־4 ס"מ, ומתפיחים 45–60 דק\' ללא כיסוי. מברישים ב'+washH+' ומפזרים שומשום.'
          : 'מגלגלים כל כדור לרצועה באורך כ־'+lenh+' ס"מ וקולעים כל '+strands+' רצועות לחלה. <b>מברישים ב'+washH+'</b> מיד אחרי העיצוב, ומתפיחים שעה וחצי ללא כיסוי.',
  ];
  if(!rolls) h.push('בסיום ההתפחה <b>מברישים בשנית</b> ומפזרים שומשום.');
  h.push(bakeH+'.');
  return h;
}

function flourNote(){
  var h=Math.round(hydration()), en=isEn();
  if(flour==="mix") return en
    ? "<b>Flour:</b> the two flours blend to about 14.4% protein at "+h+"% hydration."
    : "<b>קמח:</b> שני הקמחים יחד נותנים כ־14.4% חלבון, בהידרציה של "+h+"%.";
  if(flour==="strong") return en
    ? "<b>Flour:</b> a single very strong flour (15.5% protein) takes a little more water — "+h+"% hydration — and develops faster. The crumb is chewier than with the two-flour blend."
    : "<b>קמח:</b> קמח חזק אחד (15.5% חלבון) סופג מעט יותר מים — הידרציה "+h+"% — ומתפתח מהר יותר. החלה תצא לעיסה יותר מאשר בתערובת של שני קמחים.";
  if(flour==="bread") return en
    ? "<b>Flour:</b> US supermarket bread flour (King Arthur ~12.7% protein, Gold Medal ~12%) has less protein than the strong flours, so water starts at "+h+"% hydration. King Arthur absorbs a bit more than Gold Medal. Hold back a tablespoon or two and add it if the dough looks dry after a few minutes of kneading. The gluten is weaker, so check with a windowpane test (add a minute or two of kneading if it tears), shape gently, and watch the dough rather than the clock during the final proof so the loaves do not collapse. Expect slightly less volume."
    : "<b>קמח:</b> קמח לחם מהסופר בישראל (כנראה כ־12–13% חלבון, עם תוספת גלוטן) סופג מעט פחות מהמניטובה, ולכן המים מתחילים בהידרציה של "+h+"%. שומרים כף או שתיים בצד ומוסיפים אם הבצק יבש אחרי כמה דקות לישה. כדאי לבדוק בבדיקת \"חלון\" (ואם הבצק נקרע, ללוש עוד דקה-שתיים), לקלוע בעדינות, ולעקוב אחרי הבצק ולא אחרי השעון בהתפחה האחרונה. המותגים שונים זה מזה, ולכן ההתאמה לפי המגע של הבצק.";
  return en
    ? "<b>Flour:</b> brioche flour (13.5% protein) absorbs less, so water is cut to "+h+"% hydration. If the dough feels dry after 3–4 minutes of kneading, add water a tablespoon at a time; if a ball flattens instead of holding its shape, there is too much."
    : "<b>קמח:</b> קמח בריוש (13.5% חלבון) סופג פחות, ולכן המים מופחתים להידרציה של "+h+"%. אם הבצק נראה יבש אחרי 3–4 דקות לישה, מוסיפים מים בכף כל פעם; אם כדור משתטח ולא מחזיק צורה, יש יותר מדי מים.";
}
function fatNote(){
  if(!dairy) return "";
  var b=amt("butter"), wl=0.16*b, oilEq=BASE().butter/1.2*scale;
  if(isEn()) return "<b>Butter:</b> "+WU(b)+" of unsalted butter replaces "+WU(oilEq)+" of oil (butter is about 82% fat and 16% water, so it is used at 1.2× the oil), and the water is reduced by "+
    WU(wl)+" to make up for it. Butter goes in after the gluten has started to develop, not at the start. The crumb is richer and softer, the crust browns faster, so check the loaves 3–4 minutes early, and the bread stales a little sooner. This is a dairy challah. For a pareve one, use a pareve margarine in the same amount as the butter.";
  return "<b>חמאה:</b> "+WU(b)+" חמאה לא מלוחה מחליפים "+WU(oilEq)+" שמן (חמאה היא כ־82% שומן ו־16% מים, ולכן משתמשים ב־1.2 מכמות השמן), והמים מופחתים ב־"+
    (WU(wl))+" כדי לפצות. החמאה נכנסת אחרי שהגלוטן התחיל להתפתח ולא בהתחלה. הפרוסה עשירה ורכה יותר, הקרום מתכהה מהר יותר ולכן כדאי לבדוק את החלות 3–4 דקות מוקדם, והלחם מתייבש מעט מהר יותר. החלה חלבית. לגרסה פרווה אפשר להשתמש במרגרינה פרווה באותה כמות כמו החמאה.";
}
function notes(){
  var oilSub=WU(0.8*yolkG());                 /* 80% of the yolk weight, as oil */
  var oilTotal=WU(FLOURS[flour].base.oil*scale+0.8*yolkG());
  var washTotal=washG();
  var wh=Math.round(washTotal*0.3), ww=Math.round(washTotal*0.6), ws=Math.round(washTotal*0.1*2)/2;
  if(isEn()){
    return ["<b>No yolks?</b> Pick Vegan above, or leave them out and add 80% of their weight in oil instead — "+oilSub+
      " more oil, for "+oilTotal+" total. The crumb comes out a little lighter in color and slightly softer.",
      "<b>Egg-free wash:</b> brush with a mix of <b>30% malt syrup, 60% water, 10% salt</b> by weight. For this batch that is about "+
      fmtOz(wh)+" oz malt syrup, "+fmtOz(ww)+" oz water and "+fmtOz(ws)+
      " oz salt. Warm it slightly so the syrup dissolves, brush right before baking, and expect a glossy, deeper-brown crust.",
      flourNote()];
  }
  return ["<b>אפשר בלי חלמונים:</b> בוחרים \"טבעונית\" למעלה, או משמיטים אותם ומוסיפים במקומם שמן ב־80% ממשקלם — עוד "+oilSub+
    " שמן, כלומר "+oilTotal+" סה״כ. הבצק יוצא מעט בהיר יותר ורך במקצת.",
    "<b>מריחה בלי ביצה:</b> תערובת של <b>30% מאלט סירופ, 60% מים, 10% מלח</b> לפי משקל. לכמות הזו: כ־"+
    wh+" גר' מאלט סירופ, "+ww+" גר' מים ו־"+ws+" גר' מלח. מחממים מעט כדי שהסירופ יימס, מורחים רגע לפני הכניסה לתנור ומקבלים קרום מבריק וכהה יותר.",
    flourNote()];
}

function render(){
  var t=T[lang], en=isEn();
  document.documentElement.lang=lang;
  document.documentElement.dir=en?"ltr":"rtl";
  document.body.className=en?"en":"";
  var u = shape==="rolls" ? (en?"rolls":"לחמניות") : (en?"loaves":"חלות");
  var u1 = shape==="rolls" ? (en?"roll":"לחמנייה") : (en?"loaf":"חלה");

  Array.prototype.forEach.call(langSeg.children,function(b){
    b.setAttribute("data-on",b.getAttribute("data-v")===lang?"1":"0"); });
  Array.prototype.forEach.call(shapeSeg.children,function(b){
    var v=b.getAttribute("data-v");
    b.textContent = v==="rolls"?t.rolls:t.loaf;
    b.setAttribute("data-on",v===shape?"1":"0"); });

  document.getElementById("h1").textContent=t.title;
  document.getElementById("sub").textContent=t.sub;
  document.getElementById("shapeLbl").textContent=t.shape;
  document.getElementById("flourSegLbl").textContent=t.flour;
  document.getElementById("veganLbl").textContent=t.type;
  document.getElementById("fatLbl").textContent=t.fat;
  Array.prototype.forEach.call(fatSeg.children,function(b){
    var v=b.getAttribute("data-v")==="true";
    b.textContent=v?t.dairy:t.pareve; b.setAttribute("data-on",v===dairy?"1":"0"); });
  Array.prototype.forEach.call(veganSeg.children,function(b){
    var v=b.getAttribute("data-v")==="true";
    b.textContent=v?t.vegan:t.regular; b.setAttribute("data-on",v===vegan?"1":"0"); });
  Array.prototype.forEach.call(flourSeg.children,function(b){
    var v=b.getAttribute("data-v");
    b.textContent=FLOURS[v][lang];
    b.setAttribute("data-on",v===flour?"1":"0"); });
  document.getElementById("ingHead").textContent=t.ing;
  document.getElementById("ingHint").textContent=t.hint;
  document.getElementById("methodHead").textContent=t.method;
  document.getElementById("notesHead").textContent=t.notes;
  document.getElementById("foot").innerHTML=t.foot;
  document.getElementById("unitTopUnit").textContent=en?"oz":"גר'";
  document.getElementById("flourLbl").textContent=t.flourLbl;
  document.getElementById("topUnit").textContent=u;
  document.getElementById("countUnit").textContent=u;
  document.getElementById("doughUnit").textContent=en?"oz":"גר'";
  document.getElementById("countLabel").textContent=t.countLabel(u);
  document.getElementById("doughLabel").textContent=en?"Total dough":"משקל הבצק";

  ROWS().forEach(function(r){
    set("i_"+r.k,W(amt(r.k)));
    var n=document.getElementById("n_"+r.k); if(n) n.textContent=volText(r,amt(r.k));
  });
  set("doughInput",W(dough()));
  set("countInput",String(loaves()));
  set("countTop",String(loaves()));
  set("unitTop",String(unitW));
  document.getElementById("flourNum").textContent=WU(flourG());
  var diff = en ? Math.abs(actualG()/OZ-unitW)>0.1 : Math.abs(actualG()-unitW)>2;
  document.getElementById("unitTopLbl").textContent = en
    ? "Weight per "+u1+(diff?" — actually "+fmtOz(actualG())+" oz":"")
    : "משקל "+u1+(diff?" — בפועל "+fmtG(actualG())+" גר'":"");
  document.getElementById("doughNote").textContent = en?lbText(dough()):"";
  document.getElementById("countLbl").textContent = en
    ? "How many you get" : "מספר "+u;

  var di=document.getElementById("unitTop"), ci=document.getElementById("countTop");
  di.style.width=Math.max(4,di.value.length+1.2)+"ch";
  ci.style.width=Math.max(3,ci.value.length+1.2)+"ch";

  var wr=document.getElementById("washRows");
  wr.innerHTML='<div class="sub-head">'+(en?"For the wash":"למריחה")+'</div>'+washRows().map(function(r){
    return '<div class="row"><span class="label">'+r[0]+(r[3]?'<small>'+r[3]+'</small>':'')+'</span>'+
      (r[1]?'<span class="inp" style="border-color:transparent;background:none">'+r[1]+'</span><span class="unit">'+r[2]+'</span>':'')+'</div>';
  }).join("");
  var ol=document.getElementById("steps"); ol.innerHTML="";
  steps().forEach(function(s){ var li=document.createElement("li"); li.innerHTML=s; ol.appendChild(li); });
  var nt=notes();
  document.getElementById("noteWash").innerHTML=nt[1];
  document.getElementById("noteWash").style.display=vegan?"none":"";
  document.getElementById("noteFlour").innerHTML=nt[2];
  document.getElementById("noteFat").innerHTML=fatNote();
  document.getElementById("noteFat").style.display=dairy?"":"none";
}

if(isEn()) unitW=21.25;
buildRows();
